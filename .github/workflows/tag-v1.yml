# One-shot freeze machinery: creates the immutable v1.0 tag from Actions,
# because the development credential can only push branches. Dispatched
# manually once; refuses to move an existing tag.
name: Tag V1
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to tag
        required: true
      tag:
        description: Tag name
        required: true
        default: v1.0
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the tag if it does not exist
        env:
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — refusing to move it."; exit 1
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            tag -a "$TAG" "$SHA" -m "V1 frozen as the canonical control. V2 must earn the right to replace any part of it."
          git push origin "refs/tags/$TAG"
