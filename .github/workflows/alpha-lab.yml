# The Alpha Lab: walk-forward signal evaluation over ~10 years of
# dividend-adjusted history. Runs on push when the lab changes; the deep price
# cache is separate from production's and restored by prefix like it.
# Publishes nothing — the output is a report artifact and a step summary.
name: Alpha Lab
on:
  push:
    branches: [claude/reset-repository-blank-h3ll7p]
    paths:
      - 'lab/**'
      - '.github/workflows/alpha-lab.yml'
permissions:
  contents: read
# Shared with the publish workflow's group on this branch: both spend the
# same provider key's rate budget, and running them concurrently starved the
# publish run's quote batches into a hard 429 failure. One group = one key
# user at a time.
concurrency:
  group: fmp-key
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The `deep2005` prefix retired the 2015-floor caches when the history
      # floor moved (R-016): fetchFrom only extends a cached series forward,
      # so deepening the floor needs a cold refetch, not a merge.
      - name: Restore the deep price cache
        uses: actions/cache@v4
        with:
          path: .cache/lab-prices
          key: lab-prices-deep2005-${{ github.run_id }}
          restore-keys: |
            lab-prices-deep2005-
      - name: Run the Lab
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          LAB_FROM: '2005-01-01'
        run: npx tsx lab/run.ts
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: alpha-lab-report
          path: .lab/report.json
          retention-days: 90
