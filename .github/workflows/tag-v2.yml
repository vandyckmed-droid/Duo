# One-shot release machinery: when the V2 merge lands on main (the push that
# first carries this file), tag that commit v2.0. The path filter keeps it
# dormant afterwards, and an existing tag is never moved — the same pattern
# that created v1.0.
name: Tag V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-v2.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      TAG: v2.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the tag if it does not exist
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — leaving it untouched."; exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            tag -a "$TAG" "$GITHUB_SHA" -m "V2: V1 plus the regime line and the EPS-surprise metric — the adjustments that survived the research program. Evidence in docs/V2-CHANGES.md."
          git push origin "refs/tags/$TAG"
