name: Refresh and publish

# The only workflow that sees the API key.
#
#   membership → incremental price cache → signals → validation → build →
#   commit docs/ to main → GitHub Pages (which serves main:/docs)
#
# Pages is configured to serve the docs/ directory of the default branch, so
# "deploying" is committing a fresh build there. Pushes made with the default
# GITHUB_TOKEN do not trigger workflows, so the publish commit cannot retrigger
# this workflow.
#
# The refresh is incremental: the price cache is restored, only the days after
# each ticker's last cached close are requested, and a ticker whose request
# fails keeps the history it already had. If validation fails, nothing is
# committed and the dataset already on Pages — the last one that passed —
# keeps serving.

on:
  schedule:
    # 09:00 UTC, Tuesday to Saturday: the previous session's closes have
    # settled by then, and the pipeline only ever asks for settled days.
    - cron: '0 9 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
  # A change to the pipeline or the calculation layer changes the dataset.
  # Running the whole refresh on such a pull request proves it still works
  # before it reaches the schedule, where a break would go unnoticed until the
  # site went stale. Publishing stays gated to the default branch, so this
  # validates without publishing.
  pull_request:
    paths:
      - 'pipeline/**'
      - 'src/calc/**'
      - 'src/domain/**'
      - '.github/workflows/publish.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A pull request from a fork has no access to the secret, so the refresh
    # could only fail. Skipped rather than failed: there is nothing wrong with
    # the contribution.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the calculation layer and pipeline
        run: npm run test

      # Restored by prefix, so a run picks up the most recent cache even though
      # every run writes a new key. A miss is not a failure — it costs one full
      # historical fetch and the run continues.
      - name: Restore the adjusted-price cache
        uses: actions/cache@v4
        with:
          path: .cache/prices
          key: duo-prices-${{ github.run_id }}
          restore-keys: |
            duo-prices-

      - name: Refresh the dataset
        env:
          # The credential is configured under one of these two names. Passing
          # both lets the pipeline take whichever exists rather than making a
          # working secret depend on being renamed.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: npm run refresh

      # public/ (including the freshly published public/data) is copied into
      # docs/ by the build, so the dataset and the app that reads it always
      # ship together.
      - name: Build the site into docs/
        run: npm run build

      # The strongest check available here: the secret is in this job's
      # environment, so the built site can be searched for the key itself
      # rather than for things that merely resemble one. grep stays quiet, and
      # the runner masks the value in logs regardless.
      - name: Assert no credential reached the built site
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          for name in FMP_API_KEY API_KEY; do
            value="${!name}"
            [ -n "$value" ] || continue
            if grep -rqI -- "$value" docs; then
              echo "::error::The API key value appears in the built site."
              exit 1
            fi
          done
          if grep -rqI -E 'API_KEY|apikey=' docs/assets; then
            echo "::error::A key reference leaked into the client bundle."
            exit 1
          fi
          echo "No key value, key name, or apikey parameter in the built site."

      - name: Summarise the run
        run: |
          {
            echo "### Dataset"
            echo
            node -e '
              const m = require("./docs/data/manifest.json");
              console.log(`- **As of** ${m.asOf} · ${m.calendarDays} trading days`);
              console.log(`- **Securities** ${m.counts.total} (500: ${m.counts["500"]}, 400: ${m.counts["400"]}, 600: ${m.counts["600"]})`);
              for (const p of m.membership) console.log(`- **Segment ${p.segment}** membership via \`${p.source}\``);
              console.log(`- **Excluded** ${m.excluded.length}`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # On pull requests the built site is uploaded as a downloadable preview
      # instead of being committed: unzip and run `npx serve` in it (the app
      # fetches its dataset over HTTP, so file:// will not work). Production
      # Pages stays whatever main last published.
      - name: Upload the preview site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: docs
          retention-days: 14

      # Publishing is committing docs/ to the default branch, which is what
      # Pages serves. Gated to main so a workflow_dispatch on a branch still
      # proves the pipeline without being able to publish from it.
      - name: Commit the built site to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged; nothing to publish."
            exit 0
          fi
          asOf=$(node -p 'JSON.parse(require("fs").readFileSync("docs/data/manifest.json","utf8")).asOf')
          git commit -m "Publish dataset $asOf"
          git pull --rebase origin main
          git push origin main
